<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum — Setup Wizard</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="enterprise.css">
<style>
  body { font-family: inherit; margin: 0; background: var(--bg, #0b0e14); color: var(--fg, #e6e9f0); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; margin: 8px 0 16px; }
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .steps span { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem;
                border: 1px solid var(--border, #2a3140); color: var(--muted, #8b93a7); }
  .steps span.on { background: var(--accent, #2563eb); border-color: var(--accent, #2563eb); color: #fff; }
  .steps span.done { border-color: #4ade80; color: #4ade80; }
  .card { border: 1px solid var(--border, #2a3140); border-radius: 10px; padding: 14px; margin: 10px 0; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 0.9rem; }
  th, td { text-align: start; padding: 6px 10px; border-bottom: 1px solid var(--border, #2a3140); }
  th { color: var(--muted, #8b93a7); font-weight: 600; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  button.act, .btn { border: 1px solid var(--border, #2a3140); background: transparent; color: inherit;
               padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  button.act.primary { border-color: var(--accent, #2563eb); color: var(--accent, #60a5fa); }
  button.act:disabled { opacity: 0.4; cursor: not-allowed; }
  input, select { background: var(--bg2, #11151d); color: inherit; border: 1px solid var(--border, #2a3140);
                  border-radius: 6px; padding: 5px 8px; }
  .muted { color: var(--muted, #8b93a7); font-size: 0.85rem; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; }
  .ok   { background: #12351f; color: #4ade80; }
  .warn { background: #3a2b10; color: #fbbf24; }
  .down { background: #3b1212; color: #f87171; }
  pre.cmd { background: var(--bg2, #11151d); border: 1px solid var(--border, #2a3140); border-radius: 8px;
            padding: 10px; overflow-x: auto; font-size: 0.8rem; white-space: pre-wrap; }
  .slider { width: 220px; }
  #msg { margin: 8px 0; min-height: 1.2em; }
  .hidden { display: none !important; }
  input[type=range] { accent-color: var(--accent, #2563eb); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Quantum — Setup Wizard</h1>
  <div class="row">
    <button class="act" id="lang">FA/EN</button>
    <a class="muted" id="meshLink" href="mesh">/mesh →</a>
  </div>
  <div class="steps" id="steps"></div>
  <div id="msg"></div>
  <div id="step-body"></div>
  <div class="row" id="nav">
    <button class="act" id="back">‹</button>
    <button class="act primary" id="next">›</button>
  </div>
</div>
<script src="wizard.js"></script>
</body>
</html>
