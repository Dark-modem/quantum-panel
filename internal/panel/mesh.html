<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quantum — Mesh</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="enterprise.css">
<style>
  body { font-family: inherit; margin: 0; background: var(--bg, #0b0e14); color: var(--fg, #e6e9f0); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; margin: 8px 0 16px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tabs button { background: transparent; border: 1px solid var(--border, #2a3140); color: inherit;
                 padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.active { background: var(--accent, #2563eb); border-color: var(--accent, #2563eb); }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 0.92rem; }
  th, td { text-align: start; padding: 6px 10px; border-bottom: 1px solid var(--border, #2a3140); }
  th { color: var(--muted, #8b93a7); font-weight: 600; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 0.78rem; }
  .ok   { background: #12351f; color: #4ade80; }
  .down { background: #3b1212; color: #f87171; }
  .warn { background: #3a2b10; color: #fbbf24; }
  .banner { border: 1px solid #f59e0b; background: #2a2005; padding: 10px 14px; border-radius: 10px;
            margin-bottom: 12px; display: none; }
  .banner b { color: #fbbf24; }
  button.act { border: 1px solid var(--border, #2a3140); background: transparent; color: inherit;
               padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  button.act.primary { border-color: var(--accent, #2563eb); color: var(--accent, #60a5fa); }
  .muted { color: var(--muted, #8b93a7); font-size: 0.85rem; }
  input, select { background: var(--bg2, #11151d); color: inherit; border: 1px solid var(--border, #2a3140);
                  border-radius: 6px; padding: 4px 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  #msg { margin: 8px 0; min-height: 1.2em; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Quantum — Mesh Management</h1>
  <div class="row">
    <button class="act" id="lang">FA/EN</button>
    <button class="act" id="backup" data-i18n="backup_btn">⬇ Backup</button>
    <span class="muted" id="csrf-note"></span>
  </div>
  <div class="banner" id="confirm-banner"></div>
  <div id="msg"></div>
  <div class="tabs" id="tabs">
    <button data-tab="topos" class="active" data-i18n="tab_topos">Topologies</button>
    <button data-tab="weights" data-i18n="tab_weights">Weights</button>
    <button data-tab="profiles" data-i18n="tab_profiles">Profiles</button>
    <button data-tab="traffic" data-i18n="tab_traffic">Traffic</button>
    <button data-tab="pasarguard" data-i18n="tab_pg">PasarGuard</button>
    <button data-tab="engines" data-i18n="tab_engines">Engines</button>
    <button data-tab="alerts" data-i18n="tab_alerts">Alerts</button>
  </div>
  <div id="tab-topos"></div>
  <div id="tab-weights" style="display:none"></div>
  <div id="tab-profiles" style="display:none"></div>
  <div id="tab-traffic" style="display:none"></div>
  <div id="tab-pasarguard" style="display:none"></div>
  <div id="tab-engines" style="display:none"></div>
  <div id="tab-alerts" style="display:none"></div>
</div>
<script src="mesh.js"></script>
</body>
</html>
