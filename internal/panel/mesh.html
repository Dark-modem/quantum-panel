<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Quantum — Mesh</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="enterprise.css">
<link rel="stylesheet" href="quantum-mesh.css">
</head>
<body data-t="dark">
<div class="app">
  <div class="scrim" id="scrim" hidden></div>
  <aside class="side" id="side" aria-label="ناوبری">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      Quantum <small>مش</small>
    </div>
    <nav class="nav" id="nav">
      <button data-page="dash" class="active" data-i18n="nav_dash">داشبورد</button>
      <div class="navgroup" data-i18n="ng_mesh">زیرساخت</div>
      <button data-page="topo" data-i18n="nav_topo">توپولوژی</button>
      <button data-page="servers" data-i18n="nav_servers">سرورها و ایجنت‌ها</button>
      <button data-page="tunnels" data-i18n="nav_tunnels">تونل‌ها و وزن‌ها</button>
      <button data-page="traffic" data-i18n="nav_traffic">ترافیک و صورت‌حساب</button>
      <div class="navgroup" data-i18n="ng_ops">عملیات</div>
      <button data-page="engines" data-i18n="nav_engines">موتورها</button>
      <button data-page="alerts" data-i18n="nav_alerts">هشدارها</button>
      <button data-page="security" data-i18n="nav_security">امنیت (پروفایل‌ها)</button>
      <button data-page="pasarguard" data-i18n="nav_pg">پاسارگارد</button>
      <button data-page="settings" data-i18n="nav_settings">پشتیبان‌گیری و تنظیمات</button>
    </nav>
    <div class="sidefoot">
      <a id="legacy-link" href="./" hidden data-i18n="nav_legacy">پیشرفته (نسخه قدیمی)</a>
      <button id="theme"><span data-i18n="theme_lbl">پوسته روشن/تاریک</span></button>
      <button id="lang"><span data-i18n="lang_lbl">English</span></button>
      <a id="logout" href="logout" data-i18n="logout_lbl">خروج</a>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="act menubtn" id="menubtn" aria-label="منو">☰</button>
      <h1 id="title">داشبورد</h1>
      <span class="spacer"></span>
      <button class="act small" id="refresh" data-i18n="refresh_lbl">به‌روزرسانی</button>
    </div>
    <div class="banner" id="confirm-banner"></div>
    <div class="banner err" id="global-err"></div>
    <div class="msg" id="msg" aria-live="polite"></div>

    <section id="page-dash"></section>
    <section id="page-topo" hidden></section>
    <section id="page-servers" hidden></section>
    <section id="page-tunnels" hidden></section>
    <section id="page-traffic" hidden></section>
    <section id="page-engines" hidden></section>
    <section id="page-alerts" hidden></section>
    <section id="page-security" hidden></section>
    <section id="page-pasarguard" hidden></section>
    <section id="page-settings" hidden></section>
  </main>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="mesh.js"></script>
</body>
</html>
