<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Quantum — پنل مدیریت</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="enterprise.css">
<link rel="stylesheet" href="quantum-mesh.css">
</head>
<body data-t="dark">
<div class="app">
  <div class="scrim" id="scrim" hidden></div>
  <aside class="side" id="side" aria-label="ناوبری">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      <span class="brand-name">Quantum</span>
      <small class="brand-sub" data-i18n="brand_sub">پنل</small>
    </div>
    <nav class="nav" id="nav" aria-label="main">
      <button data-nav="dash" class="active" data-i18n="nav_dash">داشبورد</button>
      <div class="navgroup" data-i18n="ng_mesh">زیرساخت</div>
      <button data-nav="topologies" data-i18n="nav_topo">توپولوژی‌ها</button>
      <button data-nav="agents" data-i18n="nav_agents">ایجنت‌ها</button>
      <button data-nav="tunnels" data-i18n="nav_tunnels">تونل‌ها و وزن‌ها</button>
      <div class="navgroup" data-i18n="ng_ops">عملیات</div>
      <button data-nav="engines" data-i18n="nav_engines">موتورها</button>
      <button data-nav="alerts" data-i18n="nav_alerts">هشدارها<span class="nvbadge" id="nav-alerts" hidden></span></button>
      <button data-nav="security" data-i18n="nav_security">امنیت</button>
      <div class="navgroup" data-i18n="ng_reports">گزارش‌ها</div>
      <button data-nav="billing" data-i18n="nav_billing">صورت‌حساب</button>
      <button data-nav="audit" data-i18n="nav_audit">گزارش رویدادها</button>
      <button data-nav="selfcheck" data-i18n="nav_selfcheck">بررسی سلامت</button>
      <button data-nav="clientconfig" data-i18n="nav_clientcfg">کانفیگ کلاینت Xray</button>
      <div class="navgroup" data-i18n="ng_system">سیستم</div>
      <button data-nav="pasarguard" data-i18n="nav_pg">پاسارگارد</button>
      <button data-nav="settings" data-i18n="nav_settings">تنظیمات</button>
    </nav>
    <div class="sidefoot">
      <a id="legacy-link" href="./" hidden data-i18n="nav_legacy">پیشرفته (نسخه قدیمی)</a>
      <span class="muted sidever" id="side-version"></span>
    </div>
  </aside>
  <main class="main">
    <header class="topbar" id="topbar">
      <button class="iconbtn menubtn" id="menubtn" aria-label="منو">☰</button>
      <h1 id="page-title" class="topbar-title">داشبورد</h1>
      <span class="spacer"></span>
      <a class="iconbtn bell" id="bell" href="#alerts" aria-label="هشدارها">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="bell-count" id="bell-count" hidden></span>
      </a>
      <button class="iconbtn" id="theme" aria-label="پوسته" title="پوسته">
        <svg viewBox="0 0 24 24" aria-hidden="true" id="theme-icon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
      </button>
      <button class="iconbtn langbtn" id="lang" aria-label="زبان">EN</button>
      <div class="usermenu" id="usermenu-wrap">
        <button class="iconbtn" id="usermenu-btn" aria-haspopup="true" aria-expanded="false" aria-label="حساب کاربری">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div class="usermenu-pop" id="usermenu" hidden>
          <div class="usermenu-id"><b id="um-user">—</b><span class="muted" id="um-version"></span></div>
          <button id="um-refresh" data-i18n="refresh_lbl">به‌روزرسانی</button>
          <button id="um-logout" data-i18n="logout_lbl">خروج</button>
        </div>
      </div>
    </header>

    <div class="banner" id="confirm-banner"></div>
    <div class="banner err" id="global-err"></div>
    <div class="msg" id="msg" aria-live="polite"></div>

    <section id="page-dash" class="page"></section>
    <section id="page-topologies" class="page" hidden></section>
    <section id="page-agents" class="page" hidden></section>
    <section id="page-agent" class="page" hidden></section>
    <section id="page-tunnels" class="page" hidden></section>
    <section id="page-tunnel" class="page" hidden></section>
    <section id="page-engines" class="page" hidden></section>
    <section id="page-alerts" class="page" hidden></section>
    <section id="page-billing" class="page" hidden></section>
    <section id="page-audit" class="page" hidden></section>
    <section id="page-selfcheck" class="page" hidden></section>
    <section id="page-clientconfig" class="page" hidden></section>
    <section id="page-security" class="page" hidden></section>
    <section id="page-pasarguard" class="page" hidden></section>
    <section id="page-settings" class="page" hidden></section>
    <section id="page-notfound" class="page" hidden></section>
  </main>
</div>
<div id="toasts"></div>
<div id="modal-root"></div>
<script src="mesh.js"></script>
</body>
</html>
